<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume - Sahilpreet Singh Bhola</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .resume-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
            min-height: 100vh;
        }
        
        .resume-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .back-button {
            display: inline-block;
            margin-bottom: 1rem;
            padding: 0.5rem 1rem;
            background: var(--primary-color);
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background 0.3s ease;
        }
        
        .back-button:hover {
            background: var(--primary-dark);
        }
        
        .pdf-viewer {
            width: 100%;
            height: 80vh;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
        
        .pdf-fallback {
            text-align: center;
            padding: 2rem;
            background: #f8f9fa;
            border-radius: 8px;
            margin-top: 1rem;
        }
        
        .download-link {
            display: inline-block;
            margin-top: 1rem;
            padding: 0.75rem 1.5rem;
            background: var(--primary-color);
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="resume-container">
        <a href="index.html" class="back-button">← Back to Portfolio</a>
        
        <div class="resume-header">
            <h1>My Resume</h1>
            <p>View or download my complete resume</p>
        </div>
        
        <!-- PDF Viewer -->
        <iframe
            src="assets/Sahilpreet_Singh_Bhola_Resume.pdf"
            class="pdf-viewer"
            type="application/pdf">
        </iframe>

        <!-- Fallback for browsers that don't support PDF viewing -->
        <div class="pdf-fallback">
            <h3>Unable to display PDF?</h3>
            <p>Your browser doesn't support PDF viewing. Please download the resume to view it.</p>
            <a href="assets/Sahilpreet_Singh_Bhola_Resume.pdf" class="download-link" download>Download Resume</a>
        </div>
    </div>
</body>
</html>
